default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5432") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 50) %>
  prepared_statements: true
  variables:
    statement_timeout: <%= ENV.fetch("POSTGRES_STATEMENT_TIMEOUT_MS", "30000") %>
    lock_timeout: <%= ENV.fetch("POSTGRES_LOCK_TIMEOUT_MS", "10000") %>
  sslmode: <%= ENV.fetch("POSTGRES_SSLMODE", "prefer") %>

development:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "jetkb_development") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "jetkb_development") %>_cable
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_DB", "jetkb_test") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_TEST_DB", "jetkb_test") %>_cable
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "jetkb_production") %>
  cable:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "jetkb_production") %>_cable
    migrations_paths: db/cable_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "jetkb_production") %>_queue
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "jetkb_production") %>_cache
    migrations_paths: db/cache_migrate
